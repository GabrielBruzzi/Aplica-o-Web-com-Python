<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Divisão</title>
</head>
<body>
    <nav>
        <a href="{{ url_for('index') }}">Início</a> |
        <a href="{{ url_for('soma_page') }}">Soma</a> |
        <a href="{{ url_for('subtracao_page') }}">Subtração</a> |
        <a href="{{ url_for('multiplicacao_page') }}">Multiplicação</a> |
        <a href="{{ url_for('divisao_page') }}">Divisão</a>
    </nav>

    <h1>Operação de Divisão</h1>
    <input type="number" id="valor1" placeholder="Valor 1">
    <input type="number" id="valor2" placeholder="Valor 2">
    <button onclick="calcular()">Calcular Divisão</button>
    <h2 id="resultado"></h2>

    <script>
        async function calcular() {
            const valor1 = document.getElementById("valor1").value;
            const valor2 = document.getElementById("valor2").value;

            const resposta = await fetch("/api/divisao", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ valor1, valor2 })
            });

            const dados = await resposta.json();
            document.getElementById("resultado").innerText = "Resultado: " + dados.resultado;
        }
    </script>
</body>
</html>
